services:
  database-test:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${TEST_MARIADB_ROOT_PASSWORD:?Defina TEST_MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: iservi_test
      MARIADB_USER: iservi_test
      MARIADB_PASSWORD: ${TEST_MARIADB_PASSWORD:?Defina TEST_MARIADB_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./iservi_schema_v1.sql:/docker-entrypoint-initdb.d/001-iservi-schema.sql:ro,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
